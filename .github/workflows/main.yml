name: Build JiScan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Download offline Chinese OCR model (chi_sim)
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -fL --retry 3 \
            -o app/src/main/assets/tessdata/chi_sim.traineddata \
            https://github.com/tesseract-ocr/tessdata_fast/raw/main/chi_sim.traineddata
          curl -fL --retry 3 \
            -o app/src/main/assets/tessdata/eng.traineddata \
            https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
          ls -lh app/src/main/assets/tessdata/

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK with date
        run: |
          DATE=$(date +%y%m%d)
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/JiScan-${DATE}.apk
          ls -lh app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JiScan-APK
          path: |
            app/build/outputs/apk/debug/JiScan-*.apk
          if-no-files-found: error
          retention-days: 90
